name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: For example "0.2.0, macOS 26" or "Android preview, Galaxy S25". The version is in Settings, About.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: Steps that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
